services:
  - type: web
    name: testly-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADSENSE_ENABLED
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: testly
